name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier format check (guards against lint prettier/prettier failures)
        run: bun run format:check

      - name: Lint insert routes (friendlyInsertError guardrails on book + pharmacy + …)
        run: bun run lint:inserts

      - name: Verify docs examples match lint:inserts rules
        run: bash tests/lint/book-docs-examples.sh

      - name: Verify FRIENDLY_INSERT_MESSAGES keys mentioned in docs exist & are wired
        run: bun tests/unit/book-docs-keys.test.ts

      - name: Unit tests
        run: |
          set -e
          for f in tests/unit/*.test.ts; do
            echo "── $f ──"
            bun "$f"
          done

      - name: TypeScript check
        run: bun run typecheck

  perf-budget:
    name: Intro performance budget
    runs-on: ubuntu-latest
    # Runs on every PR and on push to main. Fails the check when the
    # IntroOverlay bundle or logo asset exceeds thresholds defined in
    # scripts/perf-budget.mjs.
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app (runs perf:budget automatically)
        env:
          # Build-time vars — safe defaults when repo secrets are unset so
          # forks and first-time setups can still exercise the budget.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'placeholder' }}
        run: bun run build

      - name: Re-run perf budget (explicit, for clear CI logs)
        run: bun run perf:budget



  rls-tests-main:
    name: RLS integration tests (main — strict)
    runs-on: ubuntu-latest
    # Runs ONLY on push to main. Missing Supabase secrets = hard failure.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Verify Supabase secrets are present (early check — required on main)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          missing=()
          [ -z "$SUPABASE_URL" ] && missing+=("SUPABASE_URL")
          [ -z "$SUPABASE_PUBLISHABLE_KEY" ] && missing+=("SUPABASE_PUBLISHABLE_KEY")
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing+=("SUPABASE_SERVICE_ROLE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "## ❌ RLS tests failed on main — missing Supabase secrets"
              echo ""
              echo "This early check runs **before** checkout/install to fail fast on \`main\`."
              echo ""
              echo "The following secrets are **required** but missing:"
              for s in "${missing[@]}"; do
                echo "- \`$s\`"
              done
              echo ""
              echo "Add them here: [Repository secrets](https://github.com/${{ github.repository }}/settings/secrets/actions)"
              echo ""
              echo "Note: \`SUPABASE_SERVICE_ROLE_KEY\` is not available on Lovable Cloud. For full RLS tests you need a separate Supabase project."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::RLS tests failed on main — missing secrets: ${missing[*]}. See job summary for details."
            exit 1
          fi
          echo "✅ All Supabase secrets present — proceeding with checkout, install, and full RLS suite."

      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile


      - name: Run tests/rls/* against live Supabase (strict)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          failed=0
          for f in tests/rls/*.test.ts; do
            echo "── $f ──"
            if ! bun "$f"; then
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed RLS test file(s) failed."
            exit 1
          fi

  rls-tests-pr:
    name: RLS integration tests (PR — skip mode allowed)
    runs-on: ubuntu-latest
    # Runs ONLY on pull requests from the same repo (forks redact secrets).
    # Missing secrets = clean skip with a clear summary; never fails the PR.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Verify Supabase secrets are present (early check — skip mode on PRs)
        id: verify_secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          missing=()
          [ -z "$SUPABASE_URL" ] && missing+=("SUPABASE_URL")
          [ -z "$SUPABASE_PUBLISHABLE_KEY" ] && missing+=("SUPABASE_PUBLISHABLE_KEY")
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing+=("SUPABASE_SERVICE_ROLE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "## ⚠️ RLS tests skipped on PR — missing Supabase secrets"
              echo ""
              echo "This early check runs **before** checkout/install so we skip fast on PRs without wasted work."
              echo ""
              echo "The following secrets are missing:"
              for s in "${missing[@]}"; do
                echo "- \`$s\`"
              done
              echo ""
              echo "PR runs are allowed to skip; \`main\` is strict."
              echo ""
              echo "Add them here: [Repository secrets](https://github.com/${{ github.repository }}/settings/secrets/actions)"
              echo ""
              echo "Note: \`SUPABASE_SERVICE_ROLE_KEY\` is not available on Lovable Cloud. For full tests you need a separate Supabase project; otherwise this job will keep skipping safely on PRs."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::RLS tests skipped on PR — missing secrets: ${missing[*]}. See job summary."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "✅ All Supabase secrets present — proceeding with checkout, install, and full RLS suite."
          fi

      - uses: actions/checkout@v4
        if: steps.verify_secrets.outputs.has_secrets == 'true'

      - name: Setup Bun
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        run: bun install --frozen-lockfile

      - name: Run tests/rls/* against live Supabase
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          failed=0
          for f in tests/rls/*.test.ts; do
            echo "── $f ──"
            if ! bun "$f"; then
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed RLS test file(s) failed."
            exit 1
          fi

  e2e-booking:
    name: E2E booking flow (Playwright)
    runs-on: ubuntu-latest
    # Runs on PRs from this repo and on push to main. Skips cleanly when
    # the Supabase VITE_* secrets required to build the app are missing
    # (forks / first-time setup), fails hard on main if the run itself fails.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 20
    steps:
      - name: Verify VITE_SUPABASE_* secrets are present
        id: verify_secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -e
          missing=()
          [ -z "$VITE_SUPABASE_URL" ] && missing+=("VITE_SUPABASE_URL")
          [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ] && missing+=("VITE_SUPABASE_PUBLISHABLE_KEY")
          [ -z "$VITE_SUPABASE_PROJECT_ID" ] && missing+=("VITE_SUPABASE_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "## ⚠️ E2E booking test skipped — missing VITE_SUPABASE_* secrets"
              echo ""
              echo "The following secrets are missing:"
              for s in "${missing[@]}"; do echo "- \`$s\`"; done
              echo ""
              echo "On \`main\`, add them under Repository secrets to enable the end-to-end booking check."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::E2E booking secrets missing on main — cannot run smoke test."
              exit 1
            fi
            echo "::warning::E2E booking test skipped — missing: ${missing[*]}."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.verify_secrets.outputs.has_secrets == 'true'

      - name: Setup Bun
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        run: bun install --frozen-lockfile

      - name: Install Playwright (Python) + Chromium
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        run: |
          python -m pip install --no-cache-dir playwright
          python -m playwright install --with-deps chromium

      - name: Build app
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: bun run build

      - name: Start preview server
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          nohup bun run preview --port 8080 --host 127.0.0.1 > preview.log 2>&1 &
          echo $! > preview.pid
          # Wait for the server to accept connections (max ~60s)
          for i in $(seq 1 60); do
            if curl -sSf http://127.0.0.1:8080/ > /dev/null 2>&1; then
              echo "preview ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::preview server did not become ready in 60s"
          echo "── preview.log ──"
          tail -n 200 preview.log || true
          exit 1

      - name: Seed E2E booking fixtures (idempotent)
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ci/ensure-e2e-booking-fixtures.py

      - name: Verify E2E booking fixtures (preflight)
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_MIN_AVAILABLE_SLOTS: "3"
        run: python scripts/ci/verify-e2e-booking-fixtures.py



      - name: Run booking E2E (AR full journey)
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
        run: python tests/e2e/booking-flow.py

      - name: Run booking E2E (EN full journey)
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
          E2E_BRANCH_NAME: "فرع اختبار E2E"
          E2E_SPECIALTY_NAME: "تخصص اختبار"
          E2E_DOCTOR_NAME: "د. اختبار E2E"
        run: python tests/e2e/book_full_journey_en.py

      - name: Run booking E2E (slot-hold banner)
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
          E2E_BRANCH_NAME: "فرع اختبار E2E"
          E2E_SPECIALTY_NAME: "تخصص اختبار"
          E2E_DOCTOR_NAME: "د. اختبار E2E"
        run: python tests/e2e/book_hold_banner_ar.py

      - name: Run booking E2E (conflict → step 6)
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
          E2E_BRANCH_NAME: "فرع اختبار E2E"
          E2E_SPECIALTY_NAME: "تخصص اختبار"
          E2E_DOCTOR_NAME: "د. اختبار E2E"
        run: python tests/e2e/book_conflict_returns_to_step6.py

      - name: Run booking E2E (BranchBookingForm render)
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
        run: python tests/e2e/book_branch_form_render.py

      - name: Run booking E2E (CenterBookingForm render)
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
        run: python tests/e2e/book_center_form_render.py



      - name: Run public booking API edge cases E2E
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tests/e2e/book_public_api_edge_cases.py

      - name: Run portal complaints flow E2E
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tests/e2e/portal_complaints_flow.py

      - name: Run admin redirect (no admin role) E2E
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: python tests/e2e/admin_redirect_when_not_admin.py

      - name: Ensure E2E admin user exists (auto-confirm + grant admin role)
        if: steps.verify_secrets.outputs.has_secrets == 'true' && secrets.E2E_ADMIN_EMAIL != '' && secrets.E2E_ADMIN_PASSWORD != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: python scripts/ci/ensure-e2e-admin.py

      - name: Run admin opens for admin user E2E
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: python tests/e2e/admin_opens_for_admin_user.py

      - name: Run portal cancel appointment E2E
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: python tests/e2e/portal_cancel_appointment.py

      - name: Run portal reschedule appointment E2E
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: python tests/e2e/portal_reschedule_appointment.py

      - name: Run waitlist offer confirm E2E
        if: steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tests/e2e/waitlist_offer_confirm.py


      - name: Cleanup E2E booking fixtures
        if: always() && steps.verify_secrets.outputs.has_secrets == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ci/cleanup-e2e-booking-fixtures.py

      - name: Stop preview server
        if: always() && steps.verify_secrets.outputs.has_secrets == 'true'
        run: |
          if [ -f preview.pid ]; then
            kill "$(cat preview.pid)" 2>/dev/null || true
          fi


      - name: Upload E2E artifacts (screenshots, video, trace) on failure
        id: upload_e2e_artifacts
        if: failure() && steps.verify_secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-booking-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e-artifacts/**
            preview.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build E2E artifact report
        id: e2e_report
        if: failure() && steps.verify_secrets.outputs.has_secrets == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## ❌ Booking E2E failed"
            echo ""
            echo "**Run:** [\`${{ github.run_id }}\` / attempt ${{ github.run_attempt }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }})"
            echo ""
            if [ -n "${{ steps.upload_e2e_artifacts.outputs.artifact-url }}" ]; then
              echo "**Artifact bundle (zip):** [download](${{ steps.upload_e2e_artifacts.outputs.artifact-url }})"
              echo ""
            fi
            echo "<details><summary>Captured files</summary>"
            echo ""
            if [ -d e2e-artifacts ]; then
              base_url="${{ steps.upload_e2e_artifacts.outputs.artifact-url }}"
              # Per-test breakdown (cancel / reschedule / waitlist and any others)
              for slug in portal-cancel portal-reschedule waitlist-confirm; do
                dir="e2e-artifacts/$slug"
                [ -d "$dir" ] || continue
                case "$slug" in
                  portal-cancel)      title="🛑 Cancel appointment" ;;
                  portal-reschedule)  title="🔁 Reschedule appointment" ;;
                  waitlist-confirm)   title="📥 Waitlist offer confirm" ;;
                  *)                  title="$slug" ;;
                esac
                echo "### $title (\`$slug\`)"
                echo ""
                shots=$(find "$dir" -type f -iname '*.png' | sort)
                hars=$(find "$dir" -type f -iname '*.har' | sort)
                traces=$(find "$dir" -type f -iname '*.zip' | sort)
                videos=$(find "$dir" -type f -iname '*.webm' | sort)
                emit() {
                  local label="$1"; shift
                  local files="$1"
                  [ -z "$files" ] && return
                  echo "- **$label:**"
                  while IFS= read -r f; do
                    [ -z "$f" ] && continue
                    rel="${f#e2e-artifacts/}"
                    if [ -n "$base_url" ]; then
                      echo "  - [\`$rel\`]($base_url) (download bundle, then open \`$rel\`)"
                    else
                      echo "  - \`$rel\`"
                    fi
                  done <<< "$files"
                }
                emit "Screenshots" "$shots"
                emit "HAR (network)" "$hars"
                emit "Playwright trace" "$traces"
                emit "Video" "$videos"
                echo ""
              done
              echo "<details><summary>All captured files</summary>"
              echo ""
              echo '```text'
              (cd e2e-artifacts && find . -type f \( -iname '*.png' -o -iname '*.har' -o -iname '*.zip' -o -iname '*.webm' -o -iname '*.log' \) | sort) || true
              echo '```'
              echo ""
              echo "</details>"
            else
              echo "_No e2e-artifacts directory produced._"
            fi
            echo ""
            echo "**Legend:** \`*.png\` screenshots · \`*.har\` network trace · \`trace*.zip\` Playwright trace (open at [trace.playwright.dev](https://trace.playwright.dev/)) · \`*.webm\` video · \`preview.log\` server log"

          } > e2e-comment.md
          echo "path=e2e-comment.md" >> "$GITHUB_OUTPUT"

      - name: Comment PR with E2E artifact links on failure
        if: failure() && steps.verify_secrets.outputs.has_secrets == 'true' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: e2e-booking-artifacts
          path: e2e-comment.md


